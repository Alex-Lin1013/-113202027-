const cat=document.querySelector('#category'),scope=document.querySelector('#scope'),search=document.querySelector('#search'),cards=document.querySelector('#cards'),count=document.querySelector('#count');for(const c of [...new Set(D.records.map(x=>x.category))]){const o=el('option',c);o.value=c;cat.append(o);}cat.value=filters.category;scope.value=filters.scope;search.value=filters.query;document.querySelector('#loaded').textContent=D.records.length;

function detail(id){const d=D.records.find(x=>x.id===id);if(!d){root.append(el('div','找不到這筆資料，請回資料夾。','empty'));return;}const back=el('a','← 回資料夾');back.href='#list';root.append(back,el('p',d.period,'eyebrow'),el('h1',d.name),el('p',d.organization,'muted'),el('span',state(d).label,'badge warm'),el('div','來源已閱讀・送件前請核對當期原文。這不是官方資格審核或資料已獲人工認證。','notice'));const msg=el('p','', 'status');msg.setAttribute('role','status');const actions=el('div',undefined,'actions no-print'),note=el('button','記下要問的問題','secondary'),print=el('button','列印／另存PDF','secondary');note.addEventListener('click',()=>{prefill={title:d.name+'：申請提醒',text:'□ 我的資格是否全部符合？\n□ 校內截止是哪天？\n□ 其他補助能否兼領？\n□ '+d.deadlineNote};location.hash='notes';});print.addEventListener('click',()=>window.print());actions.append(favorite(d.id,msg),note,print);root.append(actions,msg);const layout=el('div',undefined,'detail-layout section'),left=el('div',undefined,'stack'),right=el('aside',undefined,'stack');layout.append(left,right);root.append(layout);

for(const [title,text]of [['03 怎麼送件？',d.method],['04 主辦背景／方案目的',d.background]]){const p=panel(title);p.append(el('p',text));left.append(p);}const advice=panel('05 準備建議，不是加分公式');for(const x of d.tips)advice.append(el('p','• '+x));advice.append(el('small','整理建議非官方條件，不預測評選或保證錄取。'));left.append(advice);
const info=panel('日期與金額別看錯'),dl=el('dl');for(const [k,v]of [['金額',d.amount],['主辦截止',d.deadline],['參考校內截止',d.schoolDeadline],['僅適用學校',d.referenceSchool],['日期說明',d.deadlineNote],['來源整理日','2026-11-14'],['人工核對',d.verifiedAt||'未由使用者逐筆核對']])dl.append(el('dt',k),el('dd',v||'未提供／需查當期'));info.append(dl);right.append(info);const s=panel('原始公告與表件入口');for(const x of d.sources){const p=el('p',undefined,'source');p.append(link(x.title,x.url),el('small',x.publisher+' · 閱讀 '+x.readDate));s.append(p);}s.append(el('small','官方或學校轉載。未逐份下載所有空白表格，不造不存在的附件。'));right.append(s);}
function notes(){root.innerHTML=`<p class="eyebrow">PRIVATE / ON THIS BROWSER</p><h1>把沒想好的，先記下。</h1><div class="notice"><p>只存本瀏覽器，不上傳、不同步、不加密。共用裝置可能被他人查看，清除資料或換裝置可能遺失。</p><p>不要填證號、帳戶、住址、收入明細或證明文件。請定期匯出備份。</p></div><div class="detail-layout"><section class="panel"><h2 id="editor">新增筆記</h2><form id="note-form"><div class="formrow"><label for="title">標題</label><input id="title" maxlength="100" required></div><div class="formrow"><label for="text">內容</label><textarea id="text" maxlength="12000" required></textarea></div><div class="actions"><button type="submit">存進小本本</button><button type="button" id="cancel-edit" class="secondary" hidden>取消編輯</button></div></form><p id="status" class="status" role="status" aria-live="polite"></p></section><aside class="panel"><h2>備份與還原</h2><p class="muted">包含筆記、收藏及勾選。私人備份不要上傳公開GitHub。</p><div class="actions"><button id="export" class="secondary">匯出備份</button><button id="import" class="secondary">匯入備份</button></div><input id="file" type="file" accept=".json,application/json" hidden><div id="preview" hidden><p id="summary"></p><div class="actions"><button id="restore">確認覆蓋</button><button id="cancel-import" class="secondary">取消</button></div></div><button id="clear" class="danger">清空本機紀錄</button></aside></div><section class="section"><h2>我的筆記</h2><div id="notes"></div></section>`;
const title=document.querySelector('#title'),text=document.querySelector('#text'),list=document.querySelector('#notes'),msg=document.querySelector('#status'),cancel=document.querySelector('#cancel-edit');let editing=null,pending=null;if(prefill){title.value=prefill.title.slice(0,100);text.value=prefill.text.slice(0,12000);prefill=null;}function reset(){editing=null;title.value='';text.value='';cancel.hidden=true;document.querySelector('#editor').textContent='新增筆記';}function render(){list.replaceChildren();try{const v=read();if(!v.notes.length){list.append(el('p','先記下一件想問的事，就算開始了。','empty'));return;}for(const n of [...v.notes].reverse()){const c=el('article',undefined,'panel note');c.append(el('h3',n.title),el('small',new Date(n.updated).toLocaleString('zh-TW')),el('p',n.text,'note-body'));const actions=el('div',undefined,'actions'),e=el('button','編輯','secondary'),d=el('button','刪除此筆','danger');e.addEventListener('click',()=>{if((title.value||text.value)&&!confirm('換成編輯這筆？未存輸入會替換。'))return;editing=n.id;title.value=n.title;text.value=n.text;cancel.hidden=false;document.querySelector('#editor').textContent='編輯筆記';title.focus();});d.addEventListener('click',()=>{if(!confirm('刪除這筆筆記？'))return;try{const v=read();v.notes=v.notes.filter(x=>x.id!==n.id);save(v);if(editing===n.id)reset();render();msg.textContent='已刪除此筆。';}catch(e){msg.textContent=e.message;}});actions.append(e,d);c.append(actions);list.append(c);}}catch(e){msg.textContent='讀取失敗：'+e.message;}}
document.querySelector('#note-form').addEventListener('submit',e=>{e.preventDefault();if(!title.value.trim()||!text.value.trim()){msg.textContent='請填標題與內容。';return;}try{const v=read(),n={id:editing||(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random()),title:title.value.trim(),text:text.value.trim(),updated:new Date().toISOString()};if(editing){const i=v.notes.findIndex(x=>x.id===editing);if(i<0)throw Error('找不到原筆記');v.notes[i]=n;}else v.notes.push(n);save(v);reset();render();msg.textContent='已存進本機小本本。';}catch(e){msg.textContent='沒有存成功，輸入仍保留：'+e.message;}});cancel.addEventListener('click',()=>{if(confirm('取消未儲存的修改？'))reset();});
document.querySelector('#export').addEventListener('click',()=>{try{const u=URL.createObjectURL(new Blob([JSON.stringify(read(),null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='助學小本本備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);msg.textContent='已建立備份。';}catch(e){msg.textContent=e.message;}});const file=document.querySelector('#file'),pv=document.querySelector('#preview');document.querySelector('#import').addEventListener('click',()=>file.click());file.addEventListener('change',async()=>{pending=null;pv.hidden=true;try{const f=file.files[0];if(!f)return;if(f.size>5e6)throw Error('超過5MB');const v=JSON.parse(await f.text());if(!valid(v))throw Error('備份格式不符');if(!v.saved)v.saved=[];pending=v;document.querySelector('#summary').textContent='將覆蓋：'+v.notes.length+'則筆記、'+Object.keys(v.checks).length+'項勾選、'+v.saved.length+'項收藏。';pv.hidden=false;}catch(e){msg.textContent='未執行匯入：'+e.message;}finally{file.value='';}});document.querySelector('#cancel-import').addEventListener('click',()=>{pending=null;pv.hidden=true;msg.textContent='已取消，原資料不變。';});document.querySelector('#restore').addEventListener('click',()=>{if(!pending||!confirm('確認覆蓋全部本機資料？'))return;try{save(pending);pending=null;pv.hidden=true;reset();render();msg.textContent='已還原。';}catch(e){msg.textContent=e.message;}});document.querySelector('#clear').addEventListener('click',()=>{if(!confirm('刪除本機全部筆記、收藏與勾選？'))return;try{localStorage.removeItem(KEY);reset();render();msg.textContent='已清空。';}catch(e){msg.textContent=e.message;}});render();}
function guide(){root.innerHTML=`<p class="eyebrow">BEFORE YOU APPLY</p><h1>先問條件，<br>再跑文件。</h1><p class="muted">以下為一般整理建議，不是假裝申請成功的個人經驗。</p><div class="stack section"><section class="panel"><h2>01　先把條件拆開</h2><p>學籍、年齡、成績、經濟、地區、兼領，一項一項看。分辨同時符合、擇一或優先，不用單一身分替代全部資格。</p></section><section class="panel"><h2>02　文件小字往往最花時間</h2><p>先圈正本、效期、校章、推薦人。上期文件未必有效；有些依狀況提供，不是每人一整套。本站只記進度，不拿走你的證件。</p></section><section class="panel"><h2>03　背景是理解，不是猜評審</h2><p>閱讀官方宗旨，仍如實回應申請題目。具體說明需求、規劃與資源用途，不編造服務、家庭狀況或迎合立場。</p></section><section class="panel"><h2>04　別把核發日當申請日</h2><p>學年核發期間不等於全年收件，基金會截止也不代表學校還收。主辦與自己學校的期限要分開確認，郵戳、送達、線上時刻亦不同。</p></section></div>`;}
function about(){root.innerHTML=`<p class="eyebrow">WHY & HOW</p><h1>把力氣留給申請，<br>不是一直找公告。</h1><div class="stack"><section class="panel"><h2>從自己的困擾開始</h2><p>提案人在申請時覺得資訊分散、條件複雜，每個方案文件不同，因此設計固定欄位，先看資格、再備件，另留自己的提醒。不公開提案人經濟身分、不收證件、不替主辦審核。</p></section><section class="panel"><h2>這次是20筆真的寫入資料</h2><p>首頁直接載入20項不同獎學金／助學金，不將急難轉介算入、不拿同獎不同年湊數。鄭豐喜的本人與家庭子女是不同申請對象的方案。</p><p>包含常設與歷年，不代表20項現在全開。台泥為2025歷年；校內截止明標參考學校。未完成人工逐筆確認，source-reviewed只表示資料來源已閱讀，不是官方認證。</p></section><section class="panel"><h2>不是只做一頁：先把延伸規則寫好</h2><p>AGENTS.md規定欄位、來源、檔案結構、日期與測試。data/scholarships.json是唯一資料源，scripts/build.py將資料與樣式、程式整合成可離線的index.html。新增第21筆只改JSON再建立，不複製整頁。</p><div class="actions"><a href="AGENTS.md" class="btn secondary">閱讀規則</a><a href="data/scholarships.json" class="btn secondary">查看20筆JSON</a><a href="data/sources.csv" class="btn secondary" download>下載來源索引</a></div><pre>請先讀AGENTS.md及模板，根據官方網址新增第21筆。\n核對期別、資格、文件、日期、金額及來源；不猜缺漏，不冒充人工核對。\n執行build.py、validate.py及可用測試，回報真實修改。</pre></section><section class="panel"><h2>AI協助，說清楚比較安心</h2><p>需求與設計取捨由提案人提出，AI協助規則、程式、公開資料摘錄及測試。不寫未發生的申請成功或手工開發故事。資料閱讀日2026/11/14，未逐份下載所有表格；每筆可回原公告取當期文件。</p><p>筆記存在localStorage，不加密、不同步、無追蹤器或即時LLM。Colab預覽是暫時連線，最終繳交仍需公開GitHub網站。</p></section></div>`;}
